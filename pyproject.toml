[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-studio-effects"
version = "0.1.0"
description = "An open-source Linux alternative to Windows Studio Effects running on NPUs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["av>=14"]

[project.scripts]
lse = "linux_studio_effects.tui:main"
lse-ui = "linux_studio_effects.tui:main"

[tool.setuptools.packages.find]
where = ["src"]
